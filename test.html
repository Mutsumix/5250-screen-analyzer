<!DOCTYPE html>
<html>
<head>
  <title>Screen Friend - Test</title>
  <style>
    body {
      background: #1a1a1a;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      color: #4CAF50;
    }
    button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 10px;
      cursor: pointer;
      border-radius: 5px;
    }
    button:hover {
      background: #45a049;
    }
    #status {
      margin-top: 20px;
      padding: 10px;
      background: #333;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Screen Friend - Test Page</h1>
    <p>This is a test page to verify Electron is working correctly.</p>
    
    <button onclick="testFunction()">Test Button</button>
    <button onclick="showNodeInfo()">Show Node Info</button>
    
    <div id="status">
      <p>Status: Ready</p>
    </div>
  </div>

  <script>
    function testFunction() {
      document.getElementById('status').innerHTML = '<p>Status: Button clicked! ✓</p>';
    }
    
    function showNodeInfo() {
      const nodeVersion = process ? process.version : 'Not available';
      const platform = process ? process.platform : 'Not available';
      
      document.getElementById('status').innerHTML = `
        <p>Node.js Version: ${nodeVersion}</p>
        <p>Platform: ${platform}</p>
        <p>Electron working: ✓</p>
      `;
    }
  </script>
</body>
</html>
